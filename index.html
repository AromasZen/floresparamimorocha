<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Un jardín interactivo de tulipanes de todos los colores – plantá tulipanes con cada click 🌷">
    <meta name="theme-color" content="#FDF0F8">
    <title>Jardín de Tulipanes 🌷</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background warm glow overlay (intensifies with progression) -->
    <div id="warmGlow" aria-hidden="true"></div>

    <!-- Main canvas for flower rendering -->
    <canvas id="flowerCanvas" aria-label="Jardín de tulipanes interactivo"></canvas>

    <!-- Final transition overlay -->
    <div id="finalOverlay" aria-hidden="true"></div>

    <!-- Message overlays -->
    <div id="overlay">
        <!-- Initial message -->
        <div id="initialMessage" class="message-container">
            <h1 id="mainMessage"></h1>
            <p id="subMessage"></p>
        </div>

        <!-- Final message (hidden initially) -->
        <div id="finalMessage" class="message-container hidden">
            <h1 id="finalMainText"></h1>
            <p id="finalSubText"></p>
            <div id="heart" class="hidden">❤️</div>
        </div>
    </div>

    <!-- Click ripple container -->
    <div id="rippleContainer" aria-hidden="true"></div>

    <!-- Music player (hidden by default, ready for future use) -->
    <div id="musicPlayer" class="hidden">
        <button id="musicToggle" aria-label="Reproducir o pausar música" title="Música">
            <span class="music-icon">♪</span>
        </button>
    </div>

    <audio id="bgMusic" loop preload="none">
        <!-- Uncomment and set src to enable background music:
        <source src="music.mp3" type="audio/mpeg">
        -->
    </audio>

    <script src="script.js"></script>
</body>
</html>
